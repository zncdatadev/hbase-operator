apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: smoke-observability
spec:
  bindings:
  - name: hbase_version
    value: ($values.product_version)
  steps:
  # 1. Install ZooKeeper
  - name: install zookeeper
    try:
      - apply:
          file: ../setup/zookeeper.yaml
      - assert:
          file: ../setup/zookeeper-assert.yaml
    cleanup:
      - sleep:
          duration: 10s

  # 2. Install HDFS
  - name: install hdfs
    try:
      - apply:
          file: ../setup/hdfs.yaml
      - assert:
          file: ../setup/hdfs-assert.yaml
    cleanup:
      - sleep:
          duration: 5s

  # 3. Install HBase cluster
  - name: install hbase
    try:
      - apply:
          file: hbase.yaml
      - assert:
          file: hbase-assert.yaml
      - assert:
          timeout: 300s
          resource:
            kind: StatefulSet
            apiVersion: apps/v1
            metadata:
              name: test-hbase-observability-master-default
              namespace: ($namespace)
            status:
              readyReplicas: 1
      - assert:
          timeout: 300s
          resource:
            kind: StatefulSet
            apiVersion: apps/v1
            metadata:
              name: test-hbase-observability-regionserver-default
              namespace: ($namespace)
            status:
              readyReplicas: 1
      - assert:
          timeout: 300s
          resource:
            kind: StatefulSet
            apiVersion: apps/v1
            metadata:
              name: test-hbase-observability-restserver-default
              namespace: ($namespace)
            status:
              readyReplicas: 1

  # 4. Verify the complete Vector pipeline on the master role.
  - name: verify vector pipeline
    try:
      - script:
          bindings:
          - name: NAMESPACE
            value: ($namespace)
          content: |
            #!/bin/bash
            set -eu

            CONFIG=$(kubectl get configmap test-hbase-observability-master-default -n "$NAMESPACE" -o json)
            printf '%s\n' "$CONFIG" | jq -er '.data["vector.yaml"]' | grep -F 'vector-aggregator:6000'
            printf '%s\n' "$CONFIG" | jq -er '.data["vector.yaml"]' | grep -F '/kubedoop/log/*/*.log4j.xml'
            printf '%s\n' "$CONFIG" | jq -er '.data["log4j.properties"]' | grep -F '/kubedoop/log/master/master.log4j.xml'

            POD=$(kubectl get pods -n "$NAMESPACE" \
              -l app.kubernetes.io/component=master,app.kubernetes.io/instance=test-hbase-observability \
              -o jsonpath='{.items[0].metadata.name}')
            kubectl exec -n "$NAMESPACE" "$POD" -c vector -- vector --version

            kubectl port-forward -n "$NAMESPACE" "pod/$POD" 19598:9598 > /dev/null 2>&1 &
            PF_PID=$!
            trap 'kill "$PF_PID" 2>/dev/null || true' EXIT
            for _ in $(seq 1 15); do
              if METRICS=$(curl --fail --silent http://localhost:19598/metrics); then
                if printf '%s\n' "$METRICS" | grep '^# HELP' >/dev/null; then
                  exit 0
                fi
              fi
              sleep 1
            done
            echo "Vector metrics endpoint did not become ready" >&2
            exit 1

  # 5. Verify metrics port connectivity and format for all HBase roles
  - name: verify metrics connectivity
    try:
      - script:
          bindings:
          - name: NAMESPACE
            value: ($namespace)
          content: |
            #!/bin/bash
            set -e

            echo "Namespace: $NAMESPACE"

            # Test function for each role
            test_role_metrics() {
              local ROLE=$1
              local PORT=$2
              local ENDPOINT=$3
              local CONTEXT=$4

              echo "=== Testing $ROLE role (port $PORT, endpoint $ENDPOINT) ==="

              PODS=$(kubectl get pods -n "$NAMESPACE" -l app.kubernetes.io/component=$ROLE,app.kubernetes.io/instance=test-hbase-observability -o jsonpath='{.items[*].metadata.name}')
              echo "Found $ROLE pods: $PODS"

              for POD in $PODS; do
                echo "Testing Pod: $POD"

                # Port-forward to pod
                kubectl port-forward -n "$NAMESPACE" "$POD" $PORT:$PORT > /dev/null 2>&1 &
                PF_PID=$!
                sleep 3

                trap "kill $PF_PID 2>/dev/null || true" EXIT

                # Test metrics endpoint accessibility
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:$PORT$ENDPOINT)
                if [ "$HTTP_CODE" != "200" ]; then
                  echo "ERROR: Failed to access metrics endpoint, HTTP code: $HTTP_CODE"
                  kill $PF_PID 2>/dev/null || true
                  exit 1
                fi

                # Fetch metrics
                METRICS=$(curl -s http://localhost:$PORT$ENDPOINT)

                # Verify Prometheus text format (HBase 2.6.1+ returns Prometheus format)
                if ! printf '%s\n' "$METRICS" | grep '# TYPE' >/dev/null; then
                  echo "ERROR: Missing Prometheus format (# TYPE)"
                  kill $PF_PID 2>/dev/null || true
                  exit 1
                fi

                # Verify JVM metrics present in Prometheus format
                if ! printf '%s\n' "$METRICS" | grep -E '(jvm_|Jvm)' >/dev/null; then
                  echo "ERROR: Missing JVM metrics"
                  kill $PF_PID 2>/dev/null || true
                  exit 1
                fi

                # Verify product metrics, not just generic JVM metrics.
                if ! printf '%s\n' "$METRICS" | grep -F "context=\"$CONTEXT\"" >/dev/null; then
                  echo "ERROR: Missing HBase metrics context $CONTEXT"
                  kill $PF_PID 2>/dev/null || true
                  exit 1
                fi

                echo "✓ Pod $POD metrics OK"

                # Cleanup
                kill $PF_PID 2>/dev/null || true
                sleep 1
              done
            }

            # Test all three roles
            # Note: HBase 2.6.1+ provides native /prometheus endpoint
            test_role_metrics "master" "16010" "/prometheus" "master"
            test_role_metrics "regionserver" "16030" "/prometheus" "regionserver"
            test_role_metrics "restserver" "8085" "/prometheus" "rest"

            echo "✓ All HBase roles metrics verified"

  # 6. Install Prometheus
  - name: install prometheus
    try:
      - script:
          bindings:
            - name: NAMESPACE
              value: ($namespace)
          content: |
            #!/bin/bash
            set -ex

            echo "=== Environment Check ==="
            echo "NAMESPACE variable: '$NAMESPACE'"
            echo "NAMESPACE length: ${#NAMESPACE}"
            if [ -z "$NAMESPACE" ]; then
              echo "ERROR: NAMESPACE is empty!"
              exit 1
            fi

            helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update

            echo "=== Installing Prometheus ==="
            echo "Will install to namespace: $NAMESPACE"

            RELEASE="prometheus-$NAMESPACE"
            helm upgrade --install "$RELEASE" prometheus-community/prometheus \
              --version 25.3.1 \
              --namespace "$NAMESPACE" \
              --create-namespace \
              -f prometheus-values.yaml \
              --wait --timeout 5m
    cleanup:
      - script:
          bindings:
            - name: NAMESPACE
              value: ($namespace)
          content: |
            #!/bin/sh
            helm uninstall "prometheus-$NAMESPACE" --namespace "$NAMESPACE" --wait || true

  # 7. Verify Prometheus targets
  - name: verify prometheus targets
    try:
      - script:
          bindings:
            - name: NAMESPACE
              value: ($namespace)
          content: |
            #!/bin/bash
            set -e

            # Wait for Prometheus server pod
            kubectl wait --for=condition=Ready pod -l app=prometheus,component=server -n "$NAMESPACE" --timeout=300s 2>/dev/null || true
            sleep 3

            # Port-forward
            kubectl port-forward -n "$NAMESPACE" "svc/prometheus-$NAMESPACE-server" 9090:80 > /dev/null 2>&1 &
            PF_PID=$!
            trap "kill $PF_PID 2>/dev/null || true" EXIT

            # The port-forward process and the first Prometheus scrape can lag
            # behind Helm's pod readiness. Retry the complete target assertion.
            TARGETS=''
            for _ in $(seq 1 60); do
              if TARGETS=$(curl --fail --silent http://localhost:9090/api/v1/targets); then
                if printf '%s\n' "$TARGETS" | jq -e \
                  '.status == "success" and (.data.activeTargets | type == "array")' >/dev/null 2>&1; then
                  ALL_UP=true
                  for ROLE in master regionserver restserver; do
                    UP=$(printf '%s\n' "$TARGETS" | jq --arg marker "test-hbase-observability-$ROLE" \
                      '[.data.activeTargets[] | select((tostring | contains($marker)) and .health == "up")] | length')
                    if [ "$UP" -eq 0 ]; then
                      ALL_UP=false
                      break
                    fi
                  done
                  if [ "$ALL_UP" = true ]; then
                    echo "✓ All HBase roles found and UP in Prometheus targets"
                    exit 0
                  fi
                fi
              fi
              sleep 2
            done

            echo "ERROR: HBase Prometheus targets did not all become UP" >&2
            if [ -n "$TARGETS" ]; then
              printf '%s\n' "$TARGETS" | jq \
                '[.data.activeTargets[] | select(tostring | contains("test-hbase-observability")) | {labels, health, lastError}]' >&2
            fi
            exit 1
