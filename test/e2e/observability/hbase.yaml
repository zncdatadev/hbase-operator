---
apiVersion: zookeeper.kubedoop.dev/v1alpha1
kind: ZookeeperZnode
metadata:
  name: hbase-observability-znode
spec:
  clusterRef:
    name: zk
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-aggregator
data:
  ADDRESS: vector-aggregator:6000
---
apiVersion: hbase.kubedoop.dev/v1alpha1
kind: HbaseCluster
metadata:
  name: test-hbase-observability
spec:
  image:
    productVersion: ($values.product_version)
  clusterConfig:
    zookeeperConfigMapName: hbase-observability-znode
    hdfsConfigMapName: hdfs
    vectorAggregatorConfigMapName: vector-aggregator
  master:
    config:
      logging:
        enableVectorAgent: true
    roleGroups:
      default:
        replicas: 1
  regionServer:
    roleGroups:
      default:
        replicas: 1
  restServer:
    roleGroups:
      default:
        replicas: 1
